name: Build APK

on:
  push:
    branches: [ main, master, 'claude/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.MONOSYNC_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret MONOSYNC_KEYSTORE_B64 is missing. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/monosync.jks"
          echo "MONOSYNC_KEYSTORE=$RUNNER_TEMP/monosync.jks" >> "$GITHUB_ENV"

      - name: Test and build release APK
        run: ./gradlew :core:test :app:assembleRelease --continue

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/MonoSync-1.0.${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: MonoSync-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MonoSync 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' && github.ref_name != 'master' }}
          make_latest: true
          files: out/*.apk
          body: |
            Збірка з гілки `${{ github.ref_name }}`, коміт ${{ github.sha }}.
            Завантаж APK на телефон і встанови. Оновлення ставляться поверх, дані зберігаються.
