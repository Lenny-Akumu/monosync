name: Cleanup old releases

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases, tags and old runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          for id in $(gh api "repos/$REPO/releases" --paginate -q '.[].id'); do
            gh api -X DELETE "repos/$REPO/releases/$id" && echo "release $id deleted"
          done
          for t in $(gh api "repos/$REPO/tags" --paginate -q '.[].name'); do
            gh api -X DELETE "repos/$REPO/git/refs/tags/$t" && echo "tag $t deleted"
          done
          for id in $(gh api "repos/$REPO/actions/runs" --paginate -q '.workflow_runs[].id'); do
            [ "$id" = "$SELF" ] && continue
            gh api -X DELETE "repos/$REPO/actions/runs/$id" && echo "run $id deleted" || true
          done
